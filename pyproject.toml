[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-interp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "chess>=1.11.2",
    "datasets>=4.8.5",
    "deepspeed>=0.16.0",
    "einops>=0.8.2",
    "grpcio-tools>=1.60",
    "huggingface-hub>=1.12.0",
    "iceberg>=0.4",
    "ipykernel>=7.2.0",
    "llama-cpp-python>=0.3.23",
    "matplotlib>=3.10.9",
    "nnsight>=0.7.0",
    "onnx>=1.21.0",
    "onnx2torch>=1.5.15",
    "pandas>=3.0.2",
    "peft>=0.19.1",
    "protobuf>=5",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gpt_chess"]

# Normal PyPI
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "torch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.uv.sources]
torch = [
    { index = "torch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "torch-cu126", marker = "sys_platform == 'linux'" },
]
